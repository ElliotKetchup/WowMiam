plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.elliotketchup.wowmiam'
version = '1.0.0'

android {
  namespace "expo.modules.wowmiamcutout"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // On-device subject segmentation; the model itself comes through Google Play services (see the manifest).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
